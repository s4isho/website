<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=s, initial-scale=1.0">
    <title>Login Logic Demo</title>
    <script src="login-logic-script.js" defer></script>
    <style>
        body {
            font-family: Arial;
            background-color: #ffebee;
        }

        div {
            background-color: white;
            padding: 20px;
            width: 250px;
            margin: 100px auto;
            text-align: center;
            border: 1px solid rgb(255, 0, 217);
        }

        h2 {
            color: rgb(139, 0, 120);
        }

        .inputField {
            padding: 8px;
            margin: 5px;
        }

        button {
            background-color: rgb(139, 0, 120);
            color: white;
            padding: 5px 10px;
            border: none;
        }
    </style>
</head>

<body>
    <div>
        <form>
            <h2>Login</h2>
            <input type="text" id="username" class="inputField" placeholder="Username">
            <input type="password" id="password" class="inputField" placeholder="Password">
            <button id="btnLogIn">Submit</button>
            <button type="reset">Reset</button>
            <p id="errorMessage"></p>
        </form>
    </div>
    <center>
        <a href="../portfolio.html">Home</a>
    </center>
</body>

</html>
