<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery Methods</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
                $("#b1").click(function () {
                    $("#box").animate({
                        width: "300px"
                    });
                    $("#box").animate({
                        height: "300px"
                    });
                });

                $("#b2").click(function () {
                    $("#d1").delay("slow").fadeIn();
                    $("#d2").delay("fast").fadeIn();
                    $("#d3").delay(1000).fadeIn();
                    $("#d4").delay(2000).fadeIn();
                });

                $(document).ready(function () {
                    $(".btn1").click(function () {
                        $("#p1").slideUp();
                    });
                });

                $(document).ready(function () {
                    $(".b1").click(function () {
                        $("#p3").hide();
                    });
                });
            });

    </script>
    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: green;
        }

        #b1 {
            margin-top: 10px;
        }

        #border {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 2px solid green;
        }
        #border2 {
            width: 40%;
            height: 100px;
            border: 2px solid green;
            padding: 20px;
        }

        #hide {
            width: 50%;
            height: 80px;
            padding: 20px;
            margin: 10px;
            border: 2px solid green;
            font-size: 30px;
        }

        .b1 {
            margin: 10px;
        }
    </style>
</head>
<body style="text-align: center;">
    <a href="../portfolio.html"><h2>Home</h2></a>
    <br>
    <div id="box"></div>
    <button id="b1">Click Here !</button>

    <!-- Click on this button -->
    <button id="b2">Click Me!</button>
    <br><br>
    <div id="d1" style="width:50px;height:50px;display:
                none;background-color:lightgreen;"></div>
    <br>
    <div id="d2" style="width:50px;height:50px;display:
                none;background-color:green;"></div>
    <br>
    <div id="d3" style="width:50px;height:50px;display:
                none;background-color:orange;"></div>
    <br>
    <div id="d4" style="width:50px;height:50px;display:
                none;background-color:yellow;"></div>
    <br>

    <div id="border">
        <p id="p1">This paragraph will get hide.</p>
        <!-- click on this button -->
        <button class="btn1">Slide up</button>
    </div>

    <br>

    <div id="border2">
        <p id="p2">
            This paragraph will fade out !
        </p>
    
        <p>
            This paragraph will not fade !
        </p>

        <script>
            $("#p2").click(function () {
                $(this).fadeTo("slow", 0.33);
            });
        </script>
    </div>

    <br>

    <div id="hide">
        <p id="p3">GeeksforGeeks !.</p>
    </div>
    <!-- click on this button and 
        above paragraph will disappear -->
    <button class="b1">Click me !</button>
</body>
</html>
