<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Calculator</title>
  <style>
    :root {
      /* Color palette */
      --primary: #2563eb;      /* Main interactive element color (focus rings) */
      --accent: #f97316;       /* Primary action button color */
      --accent-hover: #ea580c; /* Button color on hover state */
      --bg-main: #f8fafc;      /* Page background fallback */
      --surface: #ffffff;      /* Card/Container background */
      --text-main: #0f172a;    /* Primary body text color */
      --text-muted: #64748b;   /* Muted text color for labels and secondary text */
      --border: #e2e8f0;       /* Subtle border color */
      --focus-ring: rgba(37, 99, 235, 0.2); /* Semi-transparent blue glow for input focus */
    }

    body {
      /* System font stack for clean cross-platform rendering */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* Centered card layout */
      max-width: 400px;
      margin: 60px auto;
      padding: 28px;

      /* Surface appearance */
      background-color: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;

      /* Soft elevation shadow */
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    /* Outer wrapper for layout section spacing */
    #container {
      margin-bottom: 20px;
    }

    /* Form section labels */
    label {
      display: block; /* Forces label onto its own line above inputs */
      margin: 10px 0 8px; /* Top margin 10px, zero horizontal, bottom 8px */
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; /* Standardizes text to all-caps */
      letter-spacing: 0.05em; /* Adds slight tracking for readability on uppercase text */
    }

    input-group {
      display: block; /* Stacks children vertically in natural document flow */
    }

    /* Shared properties for both input and button controls */
    input[type="number"],
    input[type="button"] {
      display: block; /* Forces full-width stacking */
      width: 100%; /* Fills the entire width of container */
      box-sizing: border-box; /* Includes padding and border in width calculations */
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease; /* Smooth state changes (hover, focus, active) */
    }

    /* Number Input Field */
    input[type="number"] {
      border: 1.5px solid var(--border);
      color: var(--text-main);
      background-color: #ffffff;
      outline: none; /* Removes default browser outline in favor of custom focus ring */
      margin-bottom: 12px; /* Spacing between the input field and the button below */
    }

    /* Focus state for Number Input */
    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring); /* Custom accessible focus outline */
    }

    /* Submit/Action Button Base Style */
    input[type="button"] {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer; /* Shows pointer cursor on hover */
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2); /* Accent color drop shadow */
    }

    /* Hover state for Button */
    input[type="button"]:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 8px rgba(249, 115, 22, 0.3); /* Slightly larger shadow on hover */
    }

    /* Active click/press state for Button */
    input[type="button"]:active {
      transform: translateY(1px); /* Slight downward displacement on click for click feedback */
    }

    /* Reset button styles (added for step 5) */
    #btnReset {
      margin-top: 10px;
      background-color: var(--text-muted);
    }

    #btnReset:hover {
      background-color: #475569;
    }

    output {
      display: block;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <form>
    <div id="container">
      <h3>Discount Calculator</h3>

      <label for="price">Price before discount</label>
      <input type="number" id="price" step="0.01" min="0">

      <label for="discount">Discount (%)</label>
      <input type="number" id="discount" step="0.01" min="0" max="100">

      <label for="priceAfter">Price after discount</label>
      <output id="priceAfter">&#8369; 0.00</output>

      <label for="savedAmount">Saved amount</label>
      <output id="savedAmount">&#8369; 0.00</output>

      <input type="button" id="btnCompute" value="Compute">
      <input type="button" id="btnReset" value="Reset">

      <label>Programmed by: Vaughn Lestat G. Cruz <br>12-Cooper</label>
    </div>
  </form>

  <script>
    const thePrice = document.getElementById("price");
    const theDiscount = document.getElementById("discount");
    const priceAfter = document.getElementById("priceAfter");
    const savedAmount = document.getElementById("savedAmount");

    function computeDiscount() {
      const convertedPrice = parseFloat(thePrice.value);
      const convertedDiscount = parseFloat(theDiscount.value);

      if (isNaN(convertedPrice) || isNaN(convertedDiscount)) {
        alert("Please enter both price and discount.");
        return;
      }

      if (convertedPrice < 0 || convertedDiscount < 0 || convertedDiscount > 100) {
        alert("Please enter valid values. Discount must be between 0 and 100.");
        return;
      }

      const saved = convertedPrice * (convertedDiscount / 100);
      const finalPrice = convertedPrice - saved;

      priceAfter.value = "\u20B1 " + finalPrice.toFixed(2);
      savedAmount.value = "\u20B1 " + saved.toFixed(2);
    }

    function resetForm() {
      thePrice.value = "";
      theDiscount.value = "";
      priceAfter.value = "\u20B1 0.00";
      savedAmount.value = "\u20B1 0.00";
      thePrice.focus();
    }

    const theButton = document.getElementById("btnCompute");
    const theResetButton = document.getElementById("btnReset");

    theButton.addEventListener('click', computeDiscount);
    theResetButton.addEventListener('click', resetForm);
  </script>

  <center>
    <a href="index.html">Home</a>
    <br>
  </center>
</body>
</html>
